<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="container">

<!-- modal -->
    
<div class="modal text-end" id="imageModal" tabindex="-1">
  <div class="modal-dialog">
 <div class="modal-header">
        <button type="button" class="btn-close btn-close-js" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
    <div class="modal-content">
  
      <div class="modal-body">

          <div class="bg-light position-absolute top-50 start-0 translate-middle-y rounded-circle p-4 d-flex justify-content-center align-items-center" onclick="previous_image()">
            <img src="images/icon-previous.svg" alt="previous" >
        </div>

        <div class="bg-light position-absolute end-0 top-50 translate-middle-y rounded-circle p-4 d-flex justify-content-center align-items-center" onclick="next_image()">
            <img src="images/icon-next.svg" alt="next" >
        </div>

        <img id="modalImage" src="" class="img-fluid">

      </div>
      
    </div>
  </div>
</div>

<!-- content -->

    <header>
    <nav class="d-flex align-items-center justify-content-evenly border-bottom gap-3 p-2">
        <img src="images/icon-menu.svg" alt="menu-icon" class="d-lg-none" id="menu">
        <img src="images/logo.svg" alt="logo">
        <ul class = "d-none d-lg-flex  list-unstyled align-items-end gap-5 list-items">
            <img src="images/icon-close.svg" alt="close-icon" class="close-btn d-lg-none">
            <li>Collections</li>
            <li>Men</li>
            <li>Women</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
        <ul class="list-unstyled d-flex align-items-center gap-5">
            <li><a><img src="images/icon-cart.svg" alt="cart-icon"></a></li>
                     
                <li><img src="images/image-avatar.png" alt="profile" class="w-50"></li>
           
        </ul>
    </nav>
    </header>

    <main>
        <div class="row gap-5 pt-5 justify-content-center align-items-center">
            <div class="col-12 col-lg-5 d-flex flex-column gap-3">
                <div class="position-relative">
                    <div class="bg-light position-absolute top-50 start-0 translate-middle-y rounded-circle p-4 d-flex justify-content-center align-items-center d-lg-none" onclick="previous_image()">
            <img src="images/icon-previous.svg" alt="previous" >
        </div>

        <div class="bg-light position-absolute end-0 top-50 translate-middle-y rounded-circle p-4 d-flex justify-content-center align-items-center d-lg-none"  onclick="next_image()">
            <img src="images/icon-next.svg" alt="next" >
        </div>
                        <img src="images/image-product-1.jpg" alt="image" class="rounded-3 w-100 main_image" onclick="openModal()">

                </div>

                <div class="d-none d-lg-flex w-100 row justify-items-between align-items-center">
                <div class="col-3">
                        <img src="images/image-product-1-thumbnail.jpg" alt="product1" class="w-100 rounded-3 thumb" onclick="change_image(this, 1)">
                </div>
                <div class="col-3">
                        <img src="images/image-product-2-thumbnail.jpg" alt="product2" class="w-100 rounded-3 thumb" onclick="change_image(this, 2)">
                </div> 
                <div class="col-3">
                        <img src="images/image-product-3-thumbnail.jpg" alt="product3" class="w-100 rounded-3 thumb" onclick="change_image(this, 3)">
                </div>
                <div class="col-3">
                        <img src="images/image-product-4-thumbnail.jpg" alt="product4" class="w-100 rounded-3 thumb" onclick="change_image(this, 4)">
                </div>
                                   
                </div>
            </div>
            
            <div class="col-12 col-lg-5 d-flex flex-column gap-2">
                <p class="text-uppercase">Sneaker Company</p>
                <h1 class="fw-bold">Fall Limited Edition Sneakers </h1>
                <p>These low-profile sneakers are your perfect casual wear companion. Featuring a durable rubber outer sole, they’ll withstand everything the weather can offer. </p>
                <h3 class="fw-bold">$125.00<span class="bg-dark text-white rounded-3 fs-6 px-2 py-1 mx-3">50%</span></h3>
                <p class="text-decoration-line-through">$250.00</p>
                <div class="d-flex flex-column gap-3 flex-lg-row justify-content-evenly align-items-center">
                    <button type="button" class="btn btn-light d-inline"><img src="images/icon-minus.svg" alt="minus-icon" onclick="decrease_number()"> <span class="px-5" id="number_span">0</span> <img src="images/icon-plus.svg" alt="plus-icon" onclick="increase_number()"></button>
                    <a href="#" class="btn btn-orange text-dark fw-bold px-5"><img src="images/icon-cart.svg" alt="cart-icon"> Add to cart</a>
                </div>
            </div>
        </div>
    </main>
   
        
    </div>
  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
